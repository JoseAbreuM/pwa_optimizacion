<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#033F73" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/icons/icono.png" />

  <title>PetroField Offline | Cavallino</title>

  <script>
    (function () {
      const storedTheme = localStorage.getItem('color-theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldUseDark = storedTheme === 'dark' || (!storedTheme && systemPrefersDark);

      document.documentElement.classList.toggle('dark', shouldUseDark);
    })();
  </script>

  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <style>
    .offline-shell-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .offline-shell-grid {
        grid-template-columns: 16rem 1fr;
      }
    }

    .offline-nav-btn.active {
      background: #033F73;
      color: #fff;
      border-color: #033F73;
    }

    html.dark .offline-nav-btn.active {
      background: #0ea5e9;
      border-color: #0ea5e9;
      color: #020617;
    }
  </style>
</head>

<body
  class="min-h-screen overflow-x-hidden bg-[#F2F2F2] text-[#0D0D0D] antialiased dark:bg-[#0f172a] dark:text-slate-100">

  <div class="offline-shell-grid min-h-screen">

    <!-- Sidebar desktop -->
    <aside class="hidden border-r border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 lg:block">
      <div class="sticky top-0 flex h-screen flex-col">
        <div class="border-b border-slate-200 p-4 dark:border-slate-800">
          <div class="flex items-center gap-3">
            <img src="/assets/icons/icono.png" alt="PetroField" class="h-10 w-10 rounded-xl object-cover" />
            <div>
              <h1 class="text-sm font-bold text-slate-900 dark:text-white">PetroField</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">Modo offline</p>
            </div>
          </div>
        </div>

        <nav class="flex-1 space-y-2 p-4 text-sm">
          <button type="button" data-offline-route="dashboard"
            class="offline-nav-btn active flex w-full items-center gap-3 rounded-xl border border-slate-200 px-3 py-2 text-left font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
            <span>📊</span>
            Dashboard
          </button>

          <button type="button" data-offline-route="pozos"
            class="offline-nav-btn flex w-full items-center gap-3 rounded-xl border border-slate-200 px-3 py-2 text-left font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
            <span>🛢️</span>
            Pozos
          </button>

          <button type="button" data-offline-route="diagnostico"
            class="offline-nav-btn flex w-full items-center gap-3 rounded-xl border border-slate-200 px-3 py-2 text-left font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
            <span>💾</span>
            Datos locales
          </button>
        </nav>

        <div class="border-t border-slate-200 p-4 text-xs text-slate-500 dark:border-slate-800 dark:text-slate-400">
          <p id="offline-last-sync">Última sync: —</p>
          <p id="offline-network-state" class="mt-1 font-semibold">—</p>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="min-w-0">
      <header
        class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-900/95">
        <div class="flex min-h-16 items-center justify-between gap-3 px-3 sm:px-4 lg:px-6">
          <div class="min-w-0">
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-700 dark:text-sky-300">
              Modo offline-first
            </p>
            <h2 id="offline-page-title" class="truncate text-lg font-bold text-slate-900 dark:text-white">
              Dashboard
            </h2>
          </div>

          <div class="flex items-center gap-2">
            <button type="button" id="offline-refresh-btn"
              class="hidden rounded-full border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800 sm:inline-flex">
              Sincronizar
            </button>

            <a href="/dashboard"
              class="rounded-full bg-[#033F73] px-3 py-1.5 text-xs font-semibold text-white hover:bg-[#022f56]">
              Ir online
            </a>
          </div>
        </div>

        <!-- Mobile nav -->
        <nav class="flex gap-2 overflow-x-auto px-3 pb-3 lg:hidden">
          <button type="button" data-offline-route="dashboard"
            class="offline-nav-btn active whitespace-nowrap rounded-full border border-slate-200 px-3 py-1.5 text-xs font-semibold dark:border-slate-700">
            Dashboard
          </button>

          <button type="button" data-offline-route="pozos"
            class="offline-nav-btn whitespace-nowrap rounded-full border border-slate-200 px-3 py-1.5 text-xs font-semibold dark:border-slate-700">
            Pozos
          </button>

          <button type="button" data-offline-route="diagnostico"
            class="offline-nav-btn whitespace-nowrap rounded-full border border-slate-200 px-3 py-1.5 text-xs font-semibold dark:border-slate-700">
            Datos locales
          </button>
        </nav>
      </header>

      <main class="min-w-0 px-3 py-4 sm:px-4 lg:px-6">
        <div id="offline-alert" class="mb-4 hidden rounded-2xl border p-4 text-sm"></div>

        <section id="offline-view" class="mx-auto w-full max-w-screen-2xl space-y-5">
          <div
            class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900">
            Cargando datos locales...
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/offline/db.js"></script>
  <script src="/js/offline/store.js"></script>
  <script src="/js/offline/sync.js"></script>
  <script src="/js/offline/app-shell.js"></script>
  <script src="/js/sw-register.js"></script>
</body>

</html>
